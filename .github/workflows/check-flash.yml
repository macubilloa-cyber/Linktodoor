# Checks pre-alerts against the Flash warehouse. Manual only: Flash's server doesn't answer from GitHub's
# runners either (tested 2026-11-25), so the hourly schedule is off; the hourly check runs on the office Mac (scripts/mac/instalar-flash.sh). Needs the secret SUPABASE_SERVICE_KEY.
name: Revisar bodega Flash

on:
  workflow_dispatch:

concurrency:
  group: check-flash
  cancel-in-progress: false

jobs:
  check-flash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flash responde
        run: node scripts/check-flash.mjs --test
      - name: Revisar pre-alertas
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/check-flash.mjs
