# Checks pre-alerts against the Flash warehouse every hour (Flash doesn't answer from Vercel).
# Needs the repository secret SUPABASE_SERVICE_KEY. The panel's "Revisar bodegas ahora" can also start it.
name: Revisar bodega Flash

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: check-flash
  cancel-in-progress: false

jobs:
  check-flash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Flash responde
        run: node scripts/check-flash.mjs --test
      - name: Revisar pre-alertas
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/check-flash.mjs
